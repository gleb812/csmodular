<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Canvas System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #modularCanvas {
            position: absolute;
            left: 0;
            top: 0;
            cursor: default;
        }
        
        .instructions {
            position: fixed;
            left: 10px;
            bottom: 10px;
            background: rgba(30, 30, 30, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <canvas id="modularCanvas"></canvas>
    <script type="module" src="./main.js"></script>
</body>
</html>
