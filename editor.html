<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module Editor - CsModular</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            overflow: hidden;
            font-family: Arial, sans-serif;
            height: 100vh;
        }
        
        #editorCanvas {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #333;
            background: #111;
        }
    </style>
</head>
<body>
    <canvas id="editorCanvas"></canvas>
    <script type="importmap">
        {
            "imports": {
                "@csound/browser": "https://www.unpkg.com/@csound/browser@6.18.7/dist/csound.js"
            }
        }
    </script>
    <script type="module" src="./editor/editor.js"></script>
</body>
</html>
